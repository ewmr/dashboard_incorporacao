name: Enviar registros de desvio ao ClickUp
# Dispara quando um arquivo exportado no painel "A enviar" do Registro de Desvios chega em
# registros/pendentes/. Cria as tarefas no Registro de Alteração de Prazos pela API do ClickUp
# (segredo CLICKUP_TOKEN) e em seguida atualiza o dashboard. Não usa o Claude.
on:
  push:
    branches: [main]
    paths: ["registros/pendentes/**"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: atualiza, cancel-in-progress: false }
jobs:
  envia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Criar os registros no ClickUp
        env: { CLICKUP_TOKEN: "${{ secrets.CLICKUP_TOKEN }}" }
        run: python3 scripts/envia_registros.py
      - name: Guardar o resultado do envio
        if: always()
        run: |
          git config user.name "Rotina do dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add -A registros
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Registros de desvio enviados ao ClickUp: $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git pull --rebase -q && git push
      - name: Atualizar o dashboard com os novos registros
        env: { CLICKUP_TOKEN: "${{ secrets.CLICKUP_TOKEN }}" }
        run: |
          pip install --quiet openpyxl
          python3 scripts/clickup_sync.py
          python3 scripts/build_dados.py
          git add -A dados.json scripts/dados historico viab registro
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualização após envio de registros: $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git pull --rebase -q && git push
