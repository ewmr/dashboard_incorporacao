name: Preencher Data Semana Passada
# Grava o campo "Data Semana Passada" das tarefas dos cronogramas Make It com o término atual,
# antes da atualização de segunda à tarde. É a referência da reunião semanal de registro de atrasos.
# Lê e grava pela API do ClickUp (segredo CLICKUP_TOKEN). Não usa o Claude.
on:
  schedule:
    - cron: "47 23 * * 0"     # domingo 20:47 em Brasília
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (mostra o que seria gravado, sem gravar)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: { group: atualiza, cancel-in-progress: false }
jobs:
  preenche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Gravar a Data Semana Passada no ClickUp
        env:
          CLICKUP_TOKEN: "${{ secrets.CLICKUP_TOKEN }}"
          SIMULAR: "${{ github.event_name == 'workflow_dispatch' && inputs.simular && '1' || '' }}"
        run: python3 scripts/data_semana_passada.py
      - name: Guardar o registro da execução
        if: always()
        run: |
          git config user.name "Rotina do dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add historico/data-semana-passada-*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Data Semana Passada: $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git pull --rebase -q && git push
