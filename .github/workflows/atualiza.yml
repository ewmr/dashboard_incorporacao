name: Atualização diária do dashboard
# Lê o ClickUp pela API (segredo CLICKUP_TOKEN), remonta o dados.json e publica. Não usa o Claude.
on:
  schedule:
    - cron: "17 9 * * *"      # 06:17 em Brasília, todos os dias
  workflow_dispatch: {}       # botão "Run workflow" para atualizar na hora
permissions:
  contents: write
concurrency: { group: atualiza, cancel-in-progress: false }
jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Conferir o token
        id: token
        env: { CLICKUP_TOKEN: "${{ secrets.CLICKUP_TOKEN }}" }
        run: |
          if [ -z "$CLICKUP_TOKEN" ]; then echo "::warning::Falta o segredo CLICKUP_TOKEN; o dashboard segue com os últimos dados."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Ler o ClickUp
        if: steps.token.outputs.ok == 'true'
        env: { CLICKUP_TOKEN: "${{ secrets.CLICKUP_TOKEN }}" }
        run: python3 scripts/clickup_sync.py
      - name: Montar dados.json
        if: steps.token.outputs.ok == 'true'
        run: python3 scripts/build_dados.py
      - name: Publicar
        if: steps.token.outputs.ok == 'true'
        run: |
          git config user.name "Rotina do dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add -A dados.json scripts/dados historico
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Atualização diária: $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git push
