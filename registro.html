function placeTip(x,y,el){const r=el.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;let left=(x??r.left+r.width/2)-w/2,top=(y!=null?y:r.top)-h-12;if(top<6)top=(y!=null?y:r.bottom)+16;left=Math.max(6,Math.min(left,innerWidth-w-6));tipEl.style.left=left+"px";tipEl.style.top=top+"px";}

  $("#fBaixa")?.addEventListener("click",baixaFila);
  $("#fRecarrega").addEventListener("click",async()=>{try{await carrega(co,true);const outro=co==="makeit"?"gadens":"makeit";try{limpaEnviados(await carrega(outro,true));}catch{}aplica(ARQ[co]);renderStrip();if(currentList)renderMain();renderFila();toast("Conferido com a leitura mais recente.");}catch{toast("Não foi possível conferir agora.");}});
  $("#fCopia")?.addEventListener("click",()=>{const txt=textoFila();try{navigator.clipboard.writeText(txt).then(()=>toast("Copiado."),()=>prompt("Copie:",txt));}catch{prompt("Copie:",txt);}});
  $("#fImp").addEventListener("change",async ev=>{const file=ev.target.files[0];if(!file)return;try{const j=JSON.parse(await file.text()),its=Array.isArray(j)?j:(j.itens||[]);const fila=lerFila(),tem=new Set(fila.map(x=>x.rid));let n=0;its.forEach(x=>{if(x&&x.rid&&x.campos&&!tem.has(x.rid)){fila.push(x);n++;}});gravaFila(fila);aplica(ARQ[co]);renderStrip();if(currentList)renderMain();renderFila();toast(n+" registro(s) importados.");}catch{toast("Arquivo inválido.");}});
  body.querySelectorAll("button.x").forEach(b=>b.addEventListener("click",()=>{const fila=lerFila(),x=fila[+b.dataset.i];if(!x||!confirm(`Tirar "${x.nome}" (${x.emp}) da fila? Ele não será enviado ao ClickUp.`))return;fila.splice(+b.dataset.i,1);gravaFila(fila);aplica(ARQ[co]);renderStrip();if(currentList)renderMain();renderFila();}));}
$("#filaBtn").addEventListener("click",abreFila);
addEventListener("storage",ev=>{if(ev.key===FILA_K)updFila();});
addEventListener("beforeunload",ev=>{const f=lerFila();if(f.length&&f.some(x=>!x.baixado)){ev.preventDefault();ev.returnValue="";}});
boot();
})();
</script>

</body></html>
